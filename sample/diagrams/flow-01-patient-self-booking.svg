Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="40" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="240" y="40" width="320" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="400" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient wants to schedule an appointment</text><text x="400" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">and opens the patient portal.</text><text x="400" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="240" y="144" width="320" height="48" rx="6" fill="#f5f5f5"/><rect x="240" y="144" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="172" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient selects an appointment type.</text><polygon points="400,232 560,300 400,368 240,300" fill="#f5f5f5"/><polygon points="400,232 560,300 400,368 240,300" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="280" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>If the patient is flagged for three no-shows in six months, self-booking is blocked and the patient must contact a receptionist.</title>If the patient is flagged</text><text x="400" y="296" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">for three no-shows in six months,</text><text x="400" y