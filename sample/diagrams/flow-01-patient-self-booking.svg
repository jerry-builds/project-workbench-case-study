<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 796" width="1000" height="796" role="img" aria-labelledby="flow-01-title flow-01-desc"><title id="flow-01-title">Flow · Patient Self-Booking</title><desc id="flow-01-desc">Workflow diagram of &quot;Patient Self-Booking&quot; for Patient: the trigger, 5 steps in order and the completion, with the 2 conditions the specification states for it, and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><g data-part="sequence"><line x1="212" y1="104" x2="212" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="192" x2="212" y2="228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="288" x2="212" y2="324" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="376" x2="212" y2="412" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="472" x2="212" y2="508" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="568" x2="212" y2="604" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="40" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="40" width="360" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="212" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient wants to schedule an appointment and</text><text x="212" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">opens the patient portal.</text><text x="212" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="32" y="144" width="360" height="48" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="360" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="172" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient selects an appointment type.</text><rect x="32" y="232" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="232" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="256" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System shows available clinician/room/time slots</text><text x="212" y="272" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">for that type.</text><rect x="32" y="328" width="360" height="48" rx="6" fill="#f5f5f5"/><rect x="32" y="328" width="360" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="356" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient selects a slot and confirms the booking.</text><rect x="32" y="416" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="416" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="440" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System reserves the clinician and room for that</text><text x="212" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">slot immediately.</text><rect x="32" y="512" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="512" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="536" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System sends a booking confirmation message and</text><text x="212" y="552" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">writes the appointment to the shared calendar.</text><rect x="32" y="608" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="608" width="360" height="64" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="212" y="628" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Appointment created, slot unavailable to other</text><text x="212" y="644" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">patients, confirmation sent, calendar updated.</text><text x="212" y="660" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="32" y="688" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="696" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-001</text><rect x="96" y="688" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="696" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-006</text><rect x="160" y="688" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="188" y="696" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-016</text><rect x="224" y="688" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="252" y="696" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-033</text></g><!--/sequence--><line x1="416" y1="40" x2="416" y2="700" stroke="rgba(45,49,66,0.15)" stroke-width="1"/><g data-part="conditions"><text x="440" y="48" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">CONDITIONS</text><text x="440" y="68" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">As listed for this workflow in the specification; not tied to a step.</text><g data-condition="1"><rect x="440" y="84" width="528" height="56" rx="6" fill="#f5f5f5"/><rect x="440" y="84" width="528" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="108" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If the patient is flagged for three no-shows in six months, self-booking</text><text x="452" y="124" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">is blocked and the patient must contact a receptionist.</text></g><g data-condition="2"><rect x="440" y="152" width="528" height="40" rx="6" fill="#f5f5f5"/><rect x="440" y="152" width="528" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="176" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If no slot matches the requested type, the booking cannot proceed.</text></g></g><!--/conditions--><g data-part="failure"><text x="440" y="232" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">IF IT FAILS</text><rect x="440" y="244" width="528" height="64" rx="20" fill="#f5f5f5"/><rect x="440" y="244" width="528" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="704" y="264" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">No matching slot is available, or the patient is no-show-flagged; the</text><text x="704" y="280" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">booking is rejected with the reason shown to the patient.</text><text x="704" y="296" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text></g><!--/failure--><line x1="32" y1="740" x2="968" y2="740" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="756" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="744" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="756" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="744" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="756" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><rect x="332" y="744" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="368" y="756" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONDITION</text><line x1="448" y1="750" x2="476" y2="750" stroke="#4f5d75" stroke-width="1"/><text x="484" y="756" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN ORDER</text><text x="32" y="784" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>