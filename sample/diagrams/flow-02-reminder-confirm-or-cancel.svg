<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 804" width="1000" height="804" role="img" aria-labelledby="flow-02-title flow-02-desc"><title id="flow-02-title">Flow · Reminder Confirm or Cancel</title><desc id="flow-02-desc">Workflow diagram of &quot;Reminder Confirm or Cancel&quot; for Patient: the trigger, 5 steps in order and the completion, with the 1 condition the specification states for it, and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><g data-part="sequence"><line x1="212" y1="104" x2="212" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="200" x2="212" y2="236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="296" x2="212" y2="332" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="384" x2="212" y2="420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="480" x2="212" y2="516" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="576" x2="212" y2="612" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="40" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="40" width="360" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="212" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">An automated reminder is due to be sent before</text><text x="212" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">an upcoming appointment.</text><text x="212" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="32" y="144" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="168" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System sends a text and email reminder at the</text><text x="212" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">configured interval before the appointment.</text><rect x="32" y="240" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="240" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="264" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The message includes a unique confirm link and a</text><text x="212" y="280" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">unique cancel link.</text><rect x="32" y="336" width="360" height="48" rx="6" fill="#f5f5f5"/><rect x="32" y="336" width="360" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="364" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient taps confirm or cancel.</text><rect x="32" y="424" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="424" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="448" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System applies the response to the appointment</text><text x="212" y="464" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">immediately.</text><rect x="32" y="520" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="520" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="544" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">If cancelled, the slot becomes available and a</text><text x="212" y="560" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">cancellation confirmation is sent.</text><rect x="32" y="616" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="616" width="360" height="64" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="212" y="636" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Appointment status updated (confirmed or</text><text x="212" y="652" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">cancelled) and the response recorded as applied.</text><text x="212" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="32" y="696" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="704" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-004</text><rect x="96" y="696" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="704" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-005</text><rect x="160" y="696" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="188" y="704" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-006</text></g><!--/sequence--><line x1="416" y1="40" x2="416" y2="708" stroke="rgba(45,49,66,0.15)" stroke-width="1"/><g data-part="conditions"><text x="440" y="48" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">CONDITIONS</text><text x="440" y="68" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">As listed for this workflow in the specification; not tied to a step.</text><g data-condition="1"><rect x="440" y="84" width="528" height="40" rx="6" fill="#f5f5f5"/><rect x="440" y="84" width="528" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="108" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Patient taps confirm versus cancel.</text></g></g><!--/conditions--><g data-part="failure"><text x="440" y="164" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">IF IT FAILS</text><rect x="440" y="176" width="528" height="64" rx="20" fill="#f5f5f5"/><rect x="440" y="176" width="528" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="704" y="196" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The reminder fails to send through the messaging service; the failure is</text><text x="704" y="212" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">recorded as not-sent.</text><text x="704" y="228" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text></g><!--/failure--><line x1="32" y1="748" x2="968" y2="748" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="764" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="752" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="764" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="752" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="764" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><rect x="332" y="752" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="368" y="764" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONDITION</text><line x1="448" y1="758" x2="476" y2="758" stroke="#4f5d75" stroke-width="1"/><text x="484" y="764" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN ORDER</text><text x="32" y="792" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>