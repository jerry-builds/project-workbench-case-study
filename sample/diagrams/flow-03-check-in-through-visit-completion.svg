<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1128" width="1000" height="1128" role="img" aria-labelledby="flow-03-title flow-03-desc"><title id="flow-03-title">Flow · Check-In Through Visit Completion</title><desc id="flow-03-desc">Workflow diagram of &quot;Check-In Through Visit Completion&quot; for Receptionist, Nurse, and Clinician: the trigger, 8 steps in order and the completion, with the 2 conditions the specification states for it, and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><g data-part="sequence"><line x1="212" y1="104" x2="212" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="192" x2="212" y2="228" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="304" x2="212" y2="340" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="400" x2="212" y2="436" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="496" x2="212" y2="532" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="592" x2="212" y2="628" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="688" x2="212" y2="724" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="784" x2="212" y2="820" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="880" x2="212" y2="916" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="40" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="40" width="360" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="212" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient arrives at the clinic for a scheduled</text><text x="212" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointment.</text><text x="212" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="32" y="144" width="360" height="48" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="360" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="172" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist checks the patient in on arrival.</text><rect x="32" y="232" width="360" height="72" rx="6" fill="#f5f5f5"/><rect x="32" y="232" width="360" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="256" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">If no intake form was submitted ahead of time,</text><text x="212" y="272" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">the patient completes it on the front-desk</text><text x="212" y="288" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">tablet.</text><rect x="32" y="344" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="344" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="368" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The checked-in patient appears on the nurse&apos;s</text><text x="212" y="384" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">day list.</text><rect x="32" y="440" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="440" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="464" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Nurse reads the intake form and marks the</text><text x="212" y="480" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">patient ready.</text><rect x="32" y="536" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="536" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="560" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Clinician sees the readiness status on their</text><text x="212" y="576" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">schedule and begins the visit.</text><rect x="32" y="632" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="632" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="656" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Clinician marks the visit complete and selects a</text><text x="212" y="672" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">visit summary code.</text><rect x="32" y="728" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="728" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="752" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System automatically sends the summary code and</text><text x="212" y="768" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">date to the billing system.</text><rect x="32" y="824" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="824" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="848" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Billing clerk reviews the completed visit and</text><text x="212" y="864" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">marks it sent to billing.</text><rect x="32" y="920" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="920" width="360" height="64" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="212" y="940" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Visit marked complete, summary code transmitted</text><text x="212" y="956" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">to billing, billing clerk marks it sent.</text><text x="212" y="972" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="32" y="1000" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-008</text><rect x="96" y="1000" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-009</text><rect x="160" y="1000" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="188" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-010</text><rect x="224" y="1000" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="252" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-011</text><rect x="288" y="1000" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="316" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-012</text><rect x="32" y="1020" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="1028" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-013</text><rect x="96" y="1020" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="1028" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-014</text><rect x="160" y="1020" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="188" y="1028" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-025</text><rect x="224" y="1020" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="252" y="1028" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-026</text></g><!--/sequence--><line x1="416" y1="40" x2="416" y2="1032" stroke="rgba(45,49,66,0.15)" stroke-width="1"/><g data-part="conditions"><text x="440" y="48" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">CONDITIONS</text><text x="440" y="68" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">As listed for this workflow in the specification; not tied to a step.</text><g data-condition="1"><rect x="440" y="84" width="528" height="56" rx="6" fill="#f5f5f5"/><rect x="440" y="84" width="528" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="108" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If the patient arrives after the no-show grace period but has not yet</text><text x="452" y="124" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">been marked no-show, check-in proceeds with a late flag.</text></g><g data-condition="2"><rect x="440" y="152" width="528" height="72" rx="6" fill="#f5f5f5"/><rect x="440" y="152" width="528" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="176" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If the patient arrives for an appointment already cancelled due to</text><text x="452" y="192" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">clinician absence, check-in is refused and rebooking slots are offered</text><text x="452" y="208" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">instead.</text></g></g><!--/conditions--><g data-part="failure"><text x="440" y="264" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">IF IT FAILS</text><rect x="440" y="276" width="528" height="64" rx="20" fill="#f5f5f5"/><rect x="440" y="276" width="528" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="704" y="296" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient arrives for a clinician-absence-cancelled appointment and is</text><text x="704" y="312" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">redirected to rebooking instead of check-in.</text><text x="704" y="328" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text></g><!--/failure--><line x1="32" y1="1072" x2="968" y2="1072" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="1088" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="1076" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="1088" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="1076" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="1088" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><rect x="332" y="1076" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="368" y="1088" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONDITION</text><line x1="448" y1="1082" x2="476" y2="1082" stroke="#4f5d75" stroke-width="1"/><text x="484" y="1088" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN ORDER</text><text x="32" y="1116" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>