<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1472" width="1000" height="1472" role="img" aria-labelledby="flow-03-title flow-03-desc"><title id="flow-03-title">Flow · Check-In Through Visit Completion</title><desc id="flow-03-desc">Flowchart of &quot;Check-In Through Visit Completion&quot; for Receptionist, Nurse, and Clinician: the trigger, 8 steps, 2 decision point(s), the completion state and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="400" y1="104" x2="400" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="200" x2="400" y2="236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="376" x2="400" y2="412" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="488" x2="400" y2="524" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="664" x2="400" y2="700" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="760" x2="400" y2="796" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="856" x2="400" y2="892" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="952" x2="400" y2="988" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="1048" x2="400" y2="1084" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="1144" x2="400" y2="1180" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="1240" x2="400" y2="1276" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="560" y1="308" x2="612" y2="308" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="578" y="288" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="588" y="296" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="40" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="240" y="40" width="320" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="400" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Patient arrives at the clinic for a</text><text x="400" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">scheduled appointment.</text><text x="400" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="240" y="144" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="144" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="168" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist checks the patient in on</text><text x="400" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">arrival.</text><polygon points="400,240 560,308 400,376 240,308" fill="#f5f5f5"/><polygon points="400,240 560,308 400,376 240,308" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="288" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>If the patient arrives after the no-show grace period but has not yet been marked no-show, check-in proceeds with a late flag.</title>If the patient arrives</text><text x="400" y="304" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">after the no-show grace period but</text><text x="400" y="320" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">has not yet been marked no-show,</text><text x="400" y="336" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">check-in proceeds with a…</text><text x="412" y="400" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">YES</text><rect x="240" y="416" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="416" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="440" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">If no intake form was submitted ahead of</text><text x="400" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">time, the patient completes it on the</text><text x="400" y="472" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">front-desk tablet.</text><polygon points="400,528 560,596 400,664 240,596" fill="#f5f5f5"/><polygon points="400,528 560,596 400,664 240,596" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="576" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>If the patient arrives for an appointment already cancelled due to clinician absence, check-in is refused and rebooking slots are offered instead.</title>If the patient arrives</text><text x="400" y="592" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">for an appointment already</text><text x="400" y="608" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">cancelled due to clinician absence,</text><text x="400" y="624" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">check-in is refused and…</text><rect x="240" y="704" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="704" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="728" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The checked-in patient appears on the</text><text x="400" y="744" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">nurse&apos;s day list.</text><rect x="240" y="800" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="800" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="824" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Nurse reads the intake form and marks the</text><text x="400" y="840" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">patient ready.</text><rect x="240" y="896" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="896" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="920" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Clinician sees the readiness status on</text><text x="400" y="936" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">their schedule and begins the visit.</text><rect x="240" y="992" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="992" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="1016" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Clinician marks the visit complete and</text><text x="400" y="1032" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">selects a visit summary code.</text><rect x="240" y="1088" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="1088" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="1112" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System automatically sends the summary</text><text x="400" y="1128" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">code and date to the billing system.</text><rect x="240" y="1184" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="1184" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="1208" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Billing clerk reviews the completed visit</text><text x="400" y="1224" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">and marks it sent to billing.</text><rect x="240" y="1280" width="320" height="80" rx="20" fill="#f5f5f5"/><rect x="240" y="1280" width="320" height="80" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="1300" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Visit marked complete, summary code</text><text x="400" y="1316" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">transmitted to billing, billing clerk</text><text x="400" y="1332" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">marks it sent.</text><text x="400" y="1348" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="616" y="268" width="320" height="80" rx="20" fill="#f5f5f5"/><rect x="616" y="268" width="320" height="80" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="776" y="288" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>Patient arrives for a clinician-absence-cancelled appointment and is redirected to rebooking instead of check-in.</title>Patient arrives for a</text><text x="776" y="304" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">clinician-absence-cancelled appointment</text><text x="776" y="320" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">and is redirected to rebooking instead of…</text><text x="776" y="336" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text><rect x="264" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="292" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-008</text><rect x="328" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="356" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-009</text><rect x="392" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="420" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-010</text><rect x="456" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="484" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-011</text><rect x="520" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="548" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-012</text><rect x="584" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="612" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-013</text><rect x="648" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="676" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-014</text><rect x="712" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="740" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-025</text><rect x="776" y="1376" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="804" y="1384" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-026</text><line x1="32" y1="1416" x2="968" y2="1416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="1420" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="1420" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><polygon points="346,1420 360,1426 346,1432 332,1426" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="368" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISION</text><line x1="440" y1="1426" x2="468" y2="1426" stroke="#eb6c36" stroke-width="1.2"/><text x="476" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HAPPY PATH</text><line x1="560" y1="1426" x2="588" y2="1426" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/><text x="596" y="1432" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REJECTED PATH</text><text x="32" y="1460" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>