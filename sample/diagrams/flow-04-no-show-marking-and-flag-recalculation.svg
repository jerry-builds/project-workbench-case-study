<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 708" width="1000" height="708" role="img" aria-labelledby="flow-04-title flow-04-desc"><title id="flow-04-title">Flow · No-Show Marking and Flag Recalculation</title><desc id="flow-04-desc">Workflow diagram of &quot;No-Show Marking and Flag Recalculation&quot; for Receptionist: the trigger, 4 steps in order and the completion, with the 1 condition the specification states for it, and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><g data-part="sequence"><line x1="212" y1="104" x2="212" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="200" x2="212" y2="236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="288" x2="212" y2="324" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="384" x2="212" y2="420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="480" x2="212" y2="516" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="40" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="40" width="360" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="212" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The grace period elapses after an appointment&apos;s</text><text x="212" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">start time with no patient arrival.</text><text x="212" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="32" y="144" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="168" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist observes the appointment has passed</text><text x="212" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">the grace period with no check-in.</text><rect x="32" y="240" width="360" height="48" rx="6" fill="#f5f5f5"/><rect x="32" y="240" width="360" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="268" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist marks the appointment as a no-show.</text><rect x="32" y="328" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="328" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="352" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System records the no-show and recalculates the</text><text x="212" y="368" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">patient&apos;s rolling six-month no-show count.</text><rect x="32" y="424" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="424" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="448" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">If the count reaches three, the system flags the</text><text x="212" y="464" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">patient for receptionist-only booking.</text><rect x="32" y="520" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="520" width="360" height="64" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="212" y="540" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">No-show recorded; flag state reflects the</text><text x="212" y="556" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">current rolling six-month count.</text><text x="212" y="572" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="32" y="600" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="608" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-015</text><rect x="96" y="600" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="608" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-016</text></g><!--/sequence--><line x1="416" y1="40" x2="416" y2="612" stroke="rgba(45,49,66,0.15)" stroke-width="1"/><g data-part="conditions"><text x="440" y="48" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">CONDITIONS</text><text x="440" y="68" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">As listed for this workflow in the specification; not tied to a step.</text><g data-condition="1"><rect x="440" y="84" width="528" height="56" rx="6" fill="#f5f5f5"/><rect x="440" y="84" width="528" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="108" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If the patient&apos;s rolling six-month no-show count is at or above three,</text><text x="452" y="124" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the flag stays set; otherwise it lifts automatically.</text></g></g><!--/conditions--><g data-part="failure"><text x="440" y="180" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">IF IT FAILS</text><rect x="440" y="192" width="528" height="64" rx="20" fill="#f5f5f5"/><rect x="440" y="192" width="528" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="704" y="212" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The grace period has not elapsed yet, so the no-show action is</text><text x="704" y="228" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">unavailable.</text><text x="704" y="244" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text></g><!--/failure--><line x1="32" y1="652" x2="968" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="656" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="656" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><rect x="332" y="656" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="368" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONDITION</text><line x1="448" y1="662" x2="476" y2="662" stroke="#4f5d75" stroke-width="1"/><text x="484" y="668" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN ORDER</text><text x="32" y="696" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>