<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 928" width="1000" height="928" role="img" aria-labelledby="flow-04-title flow-04-desc"><title id="flow-04-title">Flow · No-Show Marking and Flag Recalculation</title><desc id="flow-04-desc">Flowchart of &quot;No-Show Marking and Flag Recalculation&quot; for Receptionist: the trigger, 4 steps, 1 decision point(s), the completion state and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="400" y1="120" x2="400" y2="156" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="216" x2="400" y2="252" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="392" x2="400" y2="428" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="488" x2="400" y2="524" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="600" x2="400" y2="636" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="712" x2="400" y2="748" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="560" y1="324" x2="612" y2="324" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="578" y="304" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="588" y="312" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="40" width="320" height="80" rx="20" fill="#f5f5f5"/><rect x="240" y="40" width="320" height="80" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="400" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The grace period elapses after an</text><text x="400" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointment&apos;s start time with no patient</text><text x="400" y="92" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">arrival.</text><text x="400" y="108" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="240" y="160" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="160" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist observes the appointment has</text><text x="400" y="200" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">passed the grace period with no check-in.</text><polygon points="400,256 560,324 400,392 240,324" fill="#f5f5f5"/><polygon points="400,256 560,324 400,392 240,324" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="304" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>If the patient&apos;s rolling six-month no-show count is at or above three, the flag stays set; otherwise it lifts automatically.</title>If the patient&apos;s rolling</text><text x="400" y="320" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">six-month no-show count is at or</text><text x="400" y="336" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">above three, the flag stays set;</text><text x="400" y="352" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">otherwise it lifts…</text><text x="412" y="416" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">YES</text><rect x="240" y="432" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="432" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist marks the appointment as a</text><text x="400" y="472" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">no-show.</text><rect x="240" y="528" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="528" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="552" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System records the no-show and</text><text x="400" y="568" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">recalculates the patient&apos;s rolling</text><text x="400" y="584" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">six-month no-show count.</text><rect x="240" y="640" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="640" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="664" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">If the count reaches three, the system</text><text x="400" y="680" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">flags the patient for receptionist-only</text><text x="400" y="696" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">booking.</text><rect x="240" y="752" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="240" y="752" width="320" height="64" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="772" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">No-show recorded; flag state reflects the</text><text x="400" y="788" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">current rolling six-month count.</text><text x="400" y="804" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="616" y="292" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="616" y="292" width="320" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="776" y="312" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">The grace period has not elapsed yet, so</text><text x="776" y="328" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">the no-show action is unavailable.</text><text x="776" y="344" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text><rect x="264" y="832" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="292" y="840" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-015</text><rect x="328" y="832" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="356" y="840" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-016</text><line x1="32" y1="872" x2="968" y2="872" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="876" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="876" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><polygon points="346,876 360,882 346,888 332,882" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="368" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISION</text><line x1="440" y1="882" x2="468" y2="882" stroke="#eb6c36" stroke-width="1.2"/><text x="476" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HAPPY PATH</text><line x1="560" y1="882" x2="588" y2="882" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/><text x="596" y="888" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REJECTED PATH</text><text x="32" y="916" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>