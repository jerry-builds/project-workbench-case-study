<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1052" width="1000" height="1052" role="img" aria-labelledby="flow-05-title flow-05-desc"><title id="flow-05-title">Flow · Clinician Absence Handling</title><desc id="flow-05-desc">Workflow diagram of &quot;Clinician Absence Handling&quot; for Practice Manager and Receptionist: the trigger, 7 steps in order and the completion, with the 1 condition the specification states for it, and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><g data-part="sequence"><line x1="212" y1="104" x2="212" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="200" x2="212" y2="236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="296" x2="212" y2="332" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="392" x2="212" y2="428" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="488" x2="212" y2="524" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="584" x2="212" y2="620" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="712" x2="212" y2="748" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="212" y1="808" x2="212" y2="844" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><rect x="32" y="40" width="360" height="64" rx="20" fill="#f5f5f5"/><rect x="32" y="40" width="360" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="212" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager marks a clinician absent for a</text><text x="212" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">date range.</text><text x="212" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="32" y="144" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="168" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager marks a clinician absent for a</text><text x="212" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">date range.</text><rect x="32" y="240" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="240" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="264" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System blocks new bookings for that clinician&apos;s</text><text x="212" y="280" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">future slots in the range.</text><rect x="32" y="336" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="336" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="360" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System cancels existing appointments that fall</text><text x="212" y="376" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">within the range.</text><rect x="32" y="432" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="432" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist reviews the list of affected</text><text x="212" y="472" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointments.</text><rect x="32" y="528" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="528" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="552" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Receptionist books a new appointment in an</text><text x="212" y="568" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">available slot for each affected patient.</text><rect x="32" y="624" width="360" height="88" rx="6" fill="#f5f5f5"/><rect x="32" y="624" width="360" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="648" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System copies each patient&apos;s already-submitted</text><text x="212" y="664" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">intake form onto the new appointment, leaving</text><text x="212" y="680" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">the original attached unchanged to the cancelled</text><text x="212" y="696" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointment.</text><rect x="32" y="752" width="360" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="752" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="212" y="776" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">System sends each patient a cancellation</text><text x="212" y="792" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">confirmation and a new booking confirmation.</text><rect x="32" y="848" width="360" height="80" rx="20" fill="#f5f5f5"/><rect x="32" y="848" width="360" height="80" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="212" y="868" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">All affected appointments rebooked into new</text><text x="212" y="884" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">slots, with intake forms carried forward where</text><text x="212" y="900" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">applicable.</text><text x="212" y="916" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="32" y="944" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="60" y="952" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-024</text><rect x="96" y="944" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="124" y="952" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-025</text><rect x="160" y="944" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="188" y="952" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-006</text><rect x="224" y="944" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="252" y="952" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-033</text></g><!--/sequence--><line x1="416" y1="40" x2="416" y2="956" stroke="rgba(45,49,66,0.15)" stroke-width="1"/><g data-part="conditions"><text x="440" y="48" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">CONDITIONS</text><text x="440" y="68" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">As listed for this workflow in the specification; not tied to a step.</text><g data-condition="1"><rect x="440" y="84" width="528" height="56" rx="6" fill="#f5f5f5"/><rect x="440" y="84" width="528" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="452" y="108" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">If the affected appointment had no submitted intake form, no form is</text><text x="452" y="124" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">copied.</text></g></g><!--/conditions--><g data-part="failure"><text x="440" y="180" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">IF IT FAILS</text><rect x="440" y="192" width="528" height="64" rx="20" fill="#f5f5f5"/><rect x="440" y="192" width="528" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="704" y="212" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">A patient arrives at the clinic for the cancelled appointment before</text><text x="704" y="228" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">rebooking is complete; front desk redirects them to rebooking.</text><text x="704" y="244" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text></g><!--/failure--><line x1="32" y1="996" x2="968" y2="996" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="1000" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="1000" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><rect x="332" y="1000" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="368" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CONDITION</text><line x1="448" y1="1006" x2="476" y2="1006" stroke="#4f5d75" stroke-width="1"/><text x="484" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IN ORDER</text><text x="32" y="1040" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>