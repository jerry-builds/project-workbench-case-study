<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1024" width="1000" height="1024" role="img" aria-labelledby="flow-07-title flow-07-desc"><title id="flow-07-title">Flow · Clinic Configuration</title><desc id="flow-07-desc">Flowchart of &quot;Clinic Configuration&quot; for Practice Manager: the trigger, 5 steps, 1 decision point(s), the completion state and the failure state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="400" y1="104" x2="400" y2="140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="200" x2="400" y2="236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/><line x1="400" y1="376" x2="400" y2="412" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="472" x2="400" y2="508" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="584" x2="400" y2="620" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="680" x2="400" y2="716" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="400" y1="792" x2="400" y2="828" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><line x1="560" y1="308" x2="612" y2="308" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="578" y="288" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="588" y="296" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="40" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="240" y="40" width="320" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="400" y="60" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager needs to set up or adjust</text><text x="400" y="76" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">clinic operating parameters.</text><text x="400" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">TRIGGER</text><rect x="240" y="144" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="144" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="168" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager sets clinic hours, rooms,</text><text x="400" y="184" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointment types, and durations.</text><polygon points="400,240 560,308 400,376 240,308" fill="#f5f5f5"/><polygon points="400,240 560,308 400,376 240,308" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="304" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Entity has future appointments</text><text x="400" y="320" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">versus none.</text><text x="412" y="400" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.06em">YES</text><rect x="240" y="416" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="416" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="440" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager maintains the fixed list</text><text x="400" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">of visit summary codes.</text><rect x="240" y="512" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="512" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="536" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager sets reminder timing, the</text><text x="400" y="552" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">no-show grace period, and the patient</text><text x="400" y="568" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">self-service cutoff.</text><rect x="240" y="624" width="320" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="624" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="648" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Practice manager attempts to remove a</text><text x="400" y="664" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">room, appointment type, or clinician.</text><rect x="240" y="720" width="320" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="720" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="744" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle"><title>System blocks removal if future appointments exist for that entity; practice manager moves or cancels those appointments before removal succeeds.</title>System blocks removal if future</text><text x="400" y="760" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointments exist for that entity;</text><text x="400" y="776" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">practice manager moves or cancels those a…</text><rect x="240" y="832" width="320" height="80" rx="20" fill="#f5f5f5"/><rect x="240" y="832" width="320" height="80" rx="20" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><text x="400" y="852" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Configuration values saved and applied to</text><text x="400" y="868" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">booking, completion, and reminder logic</text><text x="400" y="884" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">clinic-wide.</text><text x="400" y="900" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COMPLETION</text><rect x="616" y="276" width="320" height="64" rx="20" fill="#f5f5f5"/><rect x="616" y="276" width="320" height="64" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="776" y="296" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Removal is blocked because future</text><text x="776" y="312" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">appointments exist for the entity.</text><text x="776" y="328" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FAILURE STATE</text><rect x="264" y="928" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="292" y="936" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-017</text><rect x="328" y="928" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="356" y="936" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-018</text><rect x="392" y="928" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="420" y="936" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-019</text><rect x="456" y="928" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="484" y="936" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REQ-023</text><line x1="32" y1="968" x2="968" y2="968" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="972" width="28" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="156" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">START / END</text><rect x="248" y="972" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="284" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STEP</text><polygon points="346,972 360,978 346,984 332,978" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="368" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISION</text><line x1="440" y1="978" x2="468" y2="978" stroke="#eb6c36" stroke-width="1.2"/><text x="476" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HAPPY PATH</text><line x1="560" y1="978" x2="588" y2="978" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/><text x="596" y="984" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REJECTED PATH</text><text x="32" y="1012" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>