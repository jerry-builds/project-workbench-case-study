<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1108" width="1000" height="1108" role="img" aria-labelledby="scope-map-title scope-map-desc"><title id="scope-map-title">Scope map · Clinic Front-Desk Operations Platform — Master PRD</title><desc id="scope-map-desc">Nested scope map: 19 version-1 capabilities inside the product&apos;s later-version boundary, inside the 1 things the product will never do or connect to.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="32" y="40" width="936" height="988" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/><rect x="48" y="32" width="400" height="16" fill="#f5f5f5"/><text x="56" y="44" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">OUTSIDE THE PRODUCT · NEVER, IN ANY VERSION</text><rect x="64" y="88" width="872" height="820" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/><rect x="80" y="80" width="344" height="16" fill="#f5f5f5"/><text x="88" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">THE PRODUCT · DEFERRED TO A LATER VERSION</text><rect x="96" y="136" width="808" height="580" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><rect x="112" y="128" width="388" height="16" fill="#f5f5f5"/><text x="120" y="140" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">VERSION 1 · IN SCOPE · M1 → M2 → M3 → M4 → M5 → M6 → M7 → M8</text><text x="120" y="172" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Patient self-service booking, reschedule, and cancel with a practice-manager-configured cutoff.</text><text x="120" y="196" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Unrestricted receptionist booking, reschedule, and cancel on behalf of any patient.</text><text x="120" y="220" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Automated text/email reminders with one-tap confirm/cancel links applied immediately.</text><text x="120" y="244" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Booking/move/cancel confirmation messages to patients.</text><text x="120" y="268" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Intake form completion ahead of visit or on a front-desk tablet at check-in, attached to a specific</text><text x="120" y="284" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">appointment.</text><text x="120" y="308" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Receptionist check-in, nurse readiness triage, and clinician readiness visibility.</text><text x="120" y="332" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Clinician visit completion with a fixed-list visit summary code.</text><text x="120" y="356" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Automatic billing-system transmission of code and date on visit completion, plus a separate billing-clerk</text><text x="120" y="372" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">&apos;sent to billing&apos; tracking status.</text><text x="120" y="396" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Grace-period-based no-show marking and a rolling six-month three-no-show flag restricting self-booking.</text><text x="120" y="420" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Practice-manager configuration of hours, rooms, appointment types, durations, and summary codes.</text><text x="120" y="444" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Room and clinician double-booking prevention.</text><text x="120" y="468" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Monthly per-clinician report and full staff-action audit logging.</text><text x="120" y="492" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Staff account deactivation preserving history; protected removal of in-use rooms/types/clinicians.</text><text x="120" y="516" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Clinician-absence cancellation and receptionist-led rebooking with intake form carry-forward.</text><text x="120" y="540" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Late-arrival check-in with a visible late flag.</text><text x="120" y="564" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Receptionist-only, records-system-matched patient account creation; practice-manager-only staff account</text><text x="120" y="580" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">creation.</text><text x="120" y="604" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Role-scoped permissions across all six roles.</text><text x="120" y="628" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">One-way appointment data feed into the clinic&apos;s existing shared calendar.</text><text x="120" y="652" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Tablet-usable front-desk and clinical screens.</text><text x="120" y="684" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">34 REQUIREMENTS · REQ-001 – REQ-034 · EACH WITH PASS/FAIL ACCEPTANCE CRITERIA</text><rect x="120" y="738" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="148" y="746" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-030</text><text x="184" y="748" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Online payment processing — deferred to a later version (DEC-030).</text><rect x="120" y="762" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="148" y="770" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-031</text><text x="184" y="772" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">A patient portal for viewing test results — deferred to a later version (DEC-031).</text><rect x="120" y="786" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="148" y="794" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-032</text><text x="184" y="796" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Telephone-call reminders — deferred to a later version (DEC-032).</text><rect x="120" y="810" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="148" y="818" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-033</text><text x="184" y="820" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Waiting-list management — deferred to a later version (DEC-033).</text><rect x="120" y="834" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="148" y="842" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-034</text><text x="184" y="844" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Clinical note-taking of any kind — deferred to a later version (DEC-034).</text><text x="120" y="876" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NICE-TO-HAVES RECORDED AS BACKLOG · PROMOTED ONLY BY A NEW APPROVED BRIEF</text><text x="72" y="948" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">NEVER, IN ANY VERSION · SEPARATE SYSTEMS LEFT ALONE</text><text x="72" y="972" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Staff-directory integration for automatic account provisioning — excluded from v1; staff accounts remain manually</text><text x="72" y="988" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">created by the practice manager.</text><line x1="32" y1="1052" x2="968" y2="1052" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="1068" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="1056" width="28" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/><text x="156" y="1068" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">VERSION 1 · BUILT NOW</text><rect x="308" y="1056" width="28" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/><text x="344" y="1068" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LATER VERSION</text><rect x="448" y="1056" width="28" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/><text x="484" y="1068" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OUTSIDE THE PRODUCT</text><text x="32" y="1096" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>