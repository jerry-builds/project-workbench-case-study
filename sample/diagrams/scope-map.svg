<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" role="img" aria-labelledby="scope-map-title scope-map-desc"><title id="scope-map-title">Scope map · Clinic Front-Desk Operations Platform — Master PRD</title><desc id="scope-map-desc">Scope map: the 19 things version 1 does, inside the 6 things it does not, each worded as in the specification.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="32" y="40" width="936" height="900" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/><rect x="48" y="32" width="115" height="16" fill="#f5f5f5"/><text x="56" y="44" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">NOT IN VERSION 1</text><rect x="72" y="88" width="856" height="592" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/><rect x="88" y="80" width="140" height="16" fill="#f5f5f5"/><text x="96" y="92" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">VERSION 1 · IN SCOPE</text><text x="96" y="124" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MILESTONES · M1 → M2 → M3 → M4 → M5 → M6 → M7 → M8</text><text x="96" y="152" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Patient self-service booking, reschedule, and cancel with a practice-manager-configured cutoff.</text><text x="96" y="176" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Unrestricted receptionist booking, reschedule, and cancel on behalf of any patient.</text><text x="96" y="200" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Automated text/email reminders with one-tap confirm/cancel links applied immediately.</text><text x="96" y="224" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Booking/move/cancel confirmation messages to patients.</text><text x="96" y="248" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Intake form completion ahead of visit or on a front-desk tablet at check-in, attached to a specific appointment.</text><text x="96" y="272" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Receptionist check-in, nurse readiness triage, and clinician readiness visibility.</text><text x="96" y="296" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Clinician visit completion with a fixed-list visit summary code.</text><text x="96" y="320" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Automatic billing-system transmission of code and date on visit completion, plus a separate billing-clerk &apos;sent</text><text x="96" y="336" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">to billing&apos; tracking status.</text><text x="96" y="360" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Grace-period-based no-show marking and a rolling six-month three-no-show flag restricting self-booking.</text><text x="96" y="384" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Practice-manager configuration of hours, rooms, appointment types, durations, and summary codes.</text><text x="96" y="408" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Room and clinician double-booking prevention.</text><text x="96" y="432" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Monthly per-clinician report and full staff-action audit logging.</text><text x="96" y="456" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Staff account deactivation preserving history; protected removal of in-use rooms/types/clinicians.</text><text x="96" y="480" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Clinician-absence cancellation and receptionist-led rebooking with intake form carry-forward.</text><text x="96" y="504" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Late-arrival check-in with a visible late flag.</text><text x="96" y="528" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Receptionist-only, records-system-matched patient account creation; practice-manager-only staff account</text><text x="96" y="544" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">creation.</text><text x="96" y="568" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Role-scoped permissions across all six roles.</text><text x="96" y="592" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">One-way appointment data feed into the clinic&apos;s existing shared calendar.</text><text x="96" y="616" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600">Tablet-usable front-desk and clinical screens.</text><text x="96" y="648" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">34 REQUIREMENTS · EACH WITH PASS/FAIL ACCEPTANCE CRITERIA</text><text x="72" y="720" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Each item is worded as in the specification. Where that wording says an item may come later or never will, the</text><text x="72" y="736" fill="#4f5d75" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">specification says so; this map does not sort them.</text><rect x="72" y="754" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="100" y="762" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-030</text><text x="136" y="764" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Online payment processing — deferred to a later version (DEC-030).</text><rect x="72" y="778" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="100" y="786" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-031</text><text x="136" y="788" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">A patient portal for viewing test results — deferred to a later version (DEC-031).</text><rect x="72" y="802" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="100" y="810" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-032</text><text x="136" y="812" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Telephone-call reminders — deferred to a later version (DEC-032).</text><rect x="72" y="826" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="100" y="834" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-033</text><text x="136" y="836" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Waiting-list management — deferred to a later version (DEC-033).</text><rect x="72" y="850" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="100" y="858" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DEC-034</text><text x="136" y="860" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Clinical note-taking of any kind — deferred to a later version (DEC-034).</text><text x="72" y="884" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">Staff-directory integration for automatic account provisioning — excluded from v1; staff accounts remain manually</text><text x="72" y="900" fill="#2d3142" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400">created by the practice manager.</text><line x1="32" y1="964" x2="968" y2="964" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="980" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="968" width="28" height="12" rx="2" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/><text x="156" y="980" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">VERSION 1 · BUILT NOW</text><rect x="308" y="968" width="28" height="12" rx="2" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/><text x="344" y="980" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOT IN VERSION 1</text><text x="32" y="1008" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Derived from the Master PRD (revision 2) · the Master controls in any conflict · request a revision rather than editing this file</text></svg>